name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: stable
          cache: true

      - run: flutter --version

      - run: flutter pub get

      - run: flutter build web --release --base-href /bms-hosxp-plus/

      # PostHog บนเว็บ: แทนรหัสใน index.html จาก Secrets (ไม่ได้ตั้ง = ไม่โหลด PostHog)
      - name: Inject PostHog keys
        env:
          POSTHOG_PROJECT_TOKEN: ${{ secrets.POSTHOG_PROJECT_TOKEN }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
        run: |
          sed -i "s|__POSTHOG_TOKEN__|${POSTHOG_PROJECT_TOKEN}|; s|__POSTHOG_HOST__|${POSTHOG_HOST}|" build/web/index.html

      - name: Copy index.html to 404.html for SPA deep links
        run: cp build/web/index.html build/web/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
